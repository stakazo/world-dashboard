<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>世界時計</title>

  <link
    rel="icon"
    type="image/x-icon"
    href="./assets/favicon.ico"
  />

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="logo">
      世界時計
    </div>

    <button
      class="side-btn"
      onclick="showClock()"
    >
      🕒
      <span>時計</span>
    </button>

    <button
      class="side-btn"
      onclick="showCalendar()"
    >
      📅
      <span>カレンダー</span>
    </button>

    <button
      class="side-btn"
      onclick="showWeather()"
    >
      ☁️
      <span>天気</span>
    </button>

    <button
      class="side-btn"
      onclick="toggleTheme()"
    >
      🌙
      <span>テーマ</span>
    </button>

  </div>

  <!-- CONTENT -->

  <div class="content">

    <!-- CLOCK PAGE -->

    <section
      id="clock-page"
      class="page active"
    >

      <h1>世界時計</h1>

      <div class="main-clock">

        <div id="tokyo-time">
          --:--:--
        </div>

        <div id="tokyo-date">
        </div>

        <div id="clock-diff">
        </div>

      </div>

      <div
        class="grid"
        id="clock-grid"
      >
      </div>

    </section>

    <!-- CALENDAR PAGE -->

    <section
      id="calendar-page"
      class="page"
    >

      <h1>カレンダー</h1>

      <div class="calendar-container">

        <div
          class="calendar-header"
          id="calendar-title"
        >
        </div>

        <div
          class="calendar-grid"
          id="calendar-grid"
        >
        </div>

      </div>

    </section>

    <!-- WEATHER PAGE -->

    <section
      id="weather-page"
      class="page"
    >

      <h1>天気</h1>

      <div
        class="weather-grid"
        id="weather-grid"
      >
      </div>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
